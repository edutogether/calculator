# main 에 push 되면 검사(test) → 배포(deploy) 순으로 돈다.
# 배포 전에 CSP 해시 검사를 먼저 돌린다 — 배포될 dist/index.html 의 인라인 블록이 바뀌었는데
# firebase.json 의 해시를 갱신하지 않은 채 배포하면 호스팅된 화면이 통째로 죽기 때문에,
# 그 경우 배포를 멈춘다. 배포 산출물은 Vite 빌드 결과(dist/)다.
#
# test/changes/deploy 세 잡으로 나눈 이유(COMMON_STANDARDS §23, 2026-09-10, §23-3 정정):
# 문서(.md·_docs/·.claude/) 한두 줄만 고쳐도 매번 배포까지 돌고 있었다. 배포는
# "사용자에게 보이는 변화가 있을 때만" 돌아야 한다.
# ⚠️ 처음엔 워크플로 트리거(on.push.paths-ignore)로 막으려 했는데, 그건 워크플로
# 전체를 끄는 것이라 이 저장소처럼 워크플로가 하나면 **검사(test)까지 같이 꺼진다**
# (§21-6) — 그래서 트리거에는 필터를 두지 않고, 판정을 별도 잡(changes)으로 빼서
# **deploy 잡에만** 그 결과를 `if:`로 건다. test·changes 둘 다 항상 돈다.
#
# 🔴 비밀(Firebase 서비스 계정)을 만지는 잡에서는 저장소 코드를 빌드·실행하지 않는다(2026-10-09 보안 지적 대응):
#   test    — 의존성 설치·빌드·검사. 비밀 없음. 결과물(dist/)을 산출물로 올리고 그 지문(sha256)을 출력한다.
#   deploy  — 산출물을 내려받아 지문이 같은지 확인한 뒤 배포만 한다. npm·빌드·저장소 스크립트 없음.
#   live    — 배포 뒤 라이브 확인. 저장소 스크립트를 돌리지만 비밀 없음.
# 수동 실행(workflow_dispatch)으로 main 이 아닌 가지를 고르면 deploy 는 돌지 않는다.
name: Firebase Hosting 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

# 이 워크플로는 GITHUB_TOKEN으로 아무것도 쓰지 않는다(체크아웃만) — 최소 권한만 준다.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      dist_sha: ${{ steps.dist.outputs.sha }}
    steps:
      # v4 는 Node.js 20 위에서 도는 액션이라 러너가 24로 강제 실행하며 경고를 띄웠다.
      # v7 부터 액션 자체가 node24 를 쓴다(runs.using: node24) — 그래서 경고가 사라진다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          # 검사 스크립트를 돌릴 Node. 20 은 2026-04 로 지원이 끝나 러너와 같은 24 로 맞춘다.
          node-version: '24'

      # 빌드·검사 의존성(devDependencies) 설치 — 배포되는 것은 dist/ 뿐이다.
      - name: 의존성 설치
        run: npm ci

      # 앱 소스(src/, TypeScript strict)의 타입 — 틀리면 빌드 전에 멈춘다.
      - name: 타입 검사 (tsc)
        run: npm run typecheck

      # 검사·테스트·대조 도구(JS)의 실수 — 안 쓰는 변수, 정의 안 된 이름.
      - name: 린트 (eslint)
        run: npm run lint

      - name: 빌드 (dist/)
        run: npm run build

      - name: CSP 해시가 배포될 dist/index.html 과 맞는지 검사
        run: node scripts/check-csp.js

      # 엑셀 라이브러리(SheetJS)가 0.19.3 이상·SRI·CSP 호스트 하나로 고정돼 있는지(네트워크 없이).
      - name: 엑셀 라이브러리 고정 검사
        run: node scripts/check-xlsx.js

      # 첫 화면(권장안)이 협의회비 상한 비율을 지키는지 — 어기면 배포하지 않는다.
      - name: 권장안이 협의회비 상한을 지키는지 검사
        run: node scripts/check-recommended.js

      # 돈의 부호가 뒤집히지 않았는지 — 남으면 +, 넘치면 −.
      - name: 돈 부호 검사
        run: node scripts/check-signs.js

      # 캡션 글자(.cap)가 카드 배경 위에서 WCAG AA(4.5:1)를 지키는지.
      - name: 캡션 대비 검사
        run: node scripts/check-contrast.js

      # 2026-09-09에 손으로 눌러 확인한 7가지 상황(부호 양쪽·0원 경계값·집행률/게이지 색·
      # 구분 번호·자동 계산·주소 왕복)과 조작된 입력값 방어를 vitest 로 고정했다
      # (tests/scenarios.test.js). 배포될 dist/index.html 을 jsdom 에 그대로 실행시켜, 사람처럼
      # 치고 눌러 화면에 그려진 값을 검사한다(앱 내부를 건드리지 않는다) — 문서(.md)는 대상이 아니다.
      - name: 시나리오 테스트 (vitest)
        run: npm test

      # 카카오톡 등 공유 카드(Open Graph·Twitter Card) 태그가 <head> 에 실제로 있는지.
      - name: 공유 카드 태그 검사
        run: node scripts/check-og.js

      # 배포할 산출물의 지문 — deploy 잡이 내려받은 것과 같은지 대조한다.
      - name: 산출물 지문 계산
        id: dist
        run: |
          cd dist
          echo "sha=$(find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: 산출물 올리기 (dist/)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # 이번 push가 배포할 만한 변경인지 판정만 한다 — 항상 돈다(문서 전용 커밋이어도 돈다).
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.check.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0 # 아래 diff 가 push 범위 전체를 봐야 하므로 전체 이력을 받는다

      - id: check
        name: 배포가 필요한 변경인지 확인
        run: |
          # 🔴 판정을 못 하는 경우는 전부 배포 쪽으로 기울인다(fail-open, §21-12) —
          # 배포를 조용히 건너뛰면 "배포가 안 됐는데 화면은 멀쩡해 보이는" 상태를
          # 우리 손으로 만드는 것이라, 잘못 판정했을 때의 대가가 훨씬 크다.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "사유: workflow_dispatch 수동 실행 — 배포한다"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "사유: 이전 커밋을 알 수 없음(새 브랜치의 첫 push 등) — 배포한다"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # git diff 자체가 실패하는 경우(예: force-push로 이력이 갈라져 before 커밋을
          # 지금 받은 이력에서 못 찾음)도 fail-open 대상이다 — 이 if/else 로 성공·실패를
          # 직접 가려서 판단한다(§21-6: 실패를 가리지 않는다. exit code 를 무시하고
          # 곧장 다음 줄로 넘어가는 방식은 쓰지 않는다).
          if ! git diff --name-only "$before" "${{ github.sha }}" > /tmp/changed.txt 2>/tmp/diff-err.txt; then
            echo "사유: git diff 명령이 실패함 — 배포한다"
            cat /tmp/diff-err.txt
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "바뀐 파일 목록 (${before}..${{ github.sha }}):"
          cat /tmp/changed.txt
          if [ ! -s /tmp/changed.txt ]; then
            echo "사유: 바뀐 파일이 0개(빈 diff) — 배포한다"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # index.html 은 문서가 아니라 제품 파일이다 — 이 정규식에 걸리지 않아야 한다.
          # 문서와 코드가 섞인 커밋도 이 grep 이 코드 파일을 하나라도 찾으면 배포로 간다.
          if grep -vE '(\.md$|^_docs/|^\.claude/)' /tmp/changed.txt | grep -q .; then
            echo "사유: 문서 이외의 파일이 바뀜 — 배포한다"
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "사유: 문서(.md·_docs/·.claude/)만 바뀜 — 배포를 생략한다"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: [test, changes]
    # 수동 실행으로 main 이 아닌 가지가 골라져도 라이브에는 배포하지 않는다.
    if: needs.changes.outputs.code == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # 저장소 코드는 firebase.json 을 읽으려고만 받는다 — 여기서 npm·빌드·저장소 스크립트를 돌리지 않는다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '24'

      - name: 산출물 내려받기 (dist/)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      # 내려받은 산출물이 test 잡이 검사한 것과 바이트까지 같은지.
      - name: 산출물 지문 확인
        env:
          EXPECTED: ${{ needs.test.outputs.dist_sha }}
        run: |
          cd dist
          got="$(find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          echo "기대 $EXPECTED / 실제 $got"
          test -n "$EXPECTED" && test "$got" = "$EXPECTED"

      # firebase.json 에 배포 전후에 명령을 돌리는 훅이 끼어들면 비밀이 있는 이 잡에서 실행된다 — 막는다.
      - name: firebase.json 에 실행 훅이 없는지 확인
        run: |
          if grep -Eq '"(predeploy|postdeploy)"' firebase.json; then echo "firebase.json 에 predeploy/postdeploy 가 있다"; exit 1; fi

      - name: Firebase Hosting 에 배포
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a  # v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INKY_CALCULATOR }}
          projectId: inky-calculator
          channelId: live
          firebaseToolsVersion: 15.32.1

  # 이번 이전의 목적이 응답 헤더라, 헤더가 빠진 배포는 성공이 아니다.
  # 두 주소를 다 본다: 사람들이 쓰는 것은 공식 주소이고, Firebase 기본 주소와 결과가
  # 갈리면 그건 커스텀 도메인 쪽 설정만 틀어졌다는 뜻이라 그 자체가 잡아야 할 신호다.
  # 저장소 스크립트를 돌리는 잡이라 비밀이 없다(deploy 잡과 일부러 나눴다).
  live:
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: '24'

      - name: 산출물 내려받기 (dist/)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: 보안 헤더 확인 — 공식 주소
        run: node scripts/check-headers.js https://calc.edutogether.kr/

      - name: 보안 헤더 확인 — Firebase 기본 주소
        run: node scripts/check-headers.js https://inky-calculator.web.app/

      # og.jpg 가 실제로 200 + image/jpeg 로 서빙되고 바이트까지 로컬과 같은지.
      # 상태 코드만 보지 않는다 — 정적 호스팅이 없는 파일에도 200 을 주는 함정이 있다.
      - name: 공유 카드 라이브 확인
        run: node scripts/check-og.js https://calc.edutogether.kr/
